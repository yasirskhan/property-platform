name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/property_platform_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/property_platform_test
      EMAIL_MODE: console
      STRIPE_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests check_parity.py generate_file_catalog.py
      - name: Run parity/registry consistency
        run: python check_parity.py
      - name: Scan for obvious committed secrets
        run: python ../scan_secrets.py
      - name: Run backend tests against PostgreSQL
        run: pytest -m "not e2e" --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install security tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Python static security scan
        working-directory: backend
        run: bandit -r app -q -ll
      - name: Audit Python runtime dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_platform_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_platform_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/property_platform_e2e
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/property_platform_e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:3000
      EMAIL_MODE: console
      STRIPE_ENABLED: "false"
      E2E_SEED_ALLOWED: "true"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: test1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for Playwright
        working-directory: backend
        run: python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install PostgreSQL client for backup/restore drill
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap and seed disposable E2E database
        working-directory: backend
        run: |
          python bootstrap_fresh_db.py
          python seed_e2e.py
      - name: Verify PostgreSQL backup and restore
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          pg_dump -h 127.0.0.1 -U postgres -d property_platform_e2e -Fc -f /tmp/property-platform-e2e.dump
          createdb -h 127.0.0.1 -U postgres property_platform_restore
          pg_restore -h 127.0.0.1 -U postgres -d property_platform_restore --exit-on-error /tmp/property-platform-e2e.dump
          USER_COUNT=$(psql -h 127.0.0.1 -U postgres -d property_platform_restore -Atc "select count(*) from users where email='e2e-admin@example.com';")
          TABLE_COUNT=$(psql -h 127.0.0.1 -U postgres -d property_platform_restore -Atc "select count(*) from information_schema.tables where table_schema='public';")
          test "$USER_COUNT" = "1"
          test "$TABLE_COUNT" = "56"
      - name: Run authenticated browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/property-backend.log 2>&1 &
          BACKEND_PID=$!
          cd ../frontend
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/property-frontend.log 2>&1 &
          FRONTEND_PID=$!
          cleanup() {
            kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && break
            if [ "$i" -eq 60 ]; then
              cat /tmp/property-backend.log
              exit 1
            fi
            sleep 1
          done

          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && break
            if [ "$i" -eq 60 ]; then
              cat /tmp/property-frontend.log
              exit 1
            fi
            sleep 1
          done

          cd ../backend
          pytest -q tests/e2e -m e2e

  staging-config:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      SECRET_KEY: ci-only-staging-jwt-secret-not-for-production-12345
      ENCRYPTION_KEY: nbvwNLDavHnxJ0MZd7e_b4gOOCFQgjAke8gtD8QwoYo=
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging compose rendering
        run: docker compose -f deploy/staging/compose.yml config >/tmp/staging-compose-rendered.yml
      - name: Build staging stack
        run: docker compose -f deploy/staging/compose.yml build
      - name: Start staging stack and smoke test
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f deploy/staging/compose.yml down -v 2>/dev/null || true
          }
          trap cleanup EXIT

          docker compose -f deploy/staging/compose.yml up -d

          for i in {1..90}; do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && break
            if [ "$i" -eq 90 ]; then
              docker compose -f deploy/staging/compose.yml ps
              docker compose -f deploy/staging/compose.yml logs backend
              exit 1
            fi
            sleep 1
          done

          for i in {1..90}; do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && break
            if [ "$i" -eq 90 ]; then
              docker compose -f deploy/staging/compose.yml ps
              docker compose -f deploy/staging/compose.yml logs frontend
              exit 1
            fi
            sleep 1
          done

          docker compose -f deploy/staging/compose.yml ps
